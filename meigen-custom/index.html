<body>
<div class="wrapper">
    <h1>キャラクター名言集</h1>
    <div class="left-box">
        <fogure>
            <img src="images/アルミン.jpeg" alt="アルミン・アルレルト">
            <figcaption>アルミン・アルレルト</figcaption>
        </fogure>
        <p>
「何かを変えることができる人間がいるとすればその人はきっと大事なものを捨てることができる人だ」</p>

    <div class="right-box">
        <fogure>
            <img src="images/ケータ.png" alt="天野ケータ">

        </fogure>
        <p>
「みんなが少しずつ我慢しているからこの世界は平和なんだ」
        </p>
    </div>

    <div class="center-box">
        <figre>
            <img src="images/aaa.jpg" alt="清水潔子">
            <figcaption>清水潔子</figcaption>
        </figre>
        <P>「何かを始めるのに“揺るぎない意志”とか”崇高な動機”なんて無くていい 成り行きで始めたものが少しずつ大事なものになっていったりする スタートに必要なのはチョコっとの好奇心くらいだよ」
        </P>
    </div>
